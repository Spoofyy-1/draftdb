[project]
name = "nba-redraft"
version = "0.1.0"
description = "Redraft every NBA draft since 2010 with TabFM and score it against the scouts on 3-year WAR"
requires-python = ">=3.11"
# Pinned to the versions the pipeline was last run with.
dependencies = [
    "tabfm[pytorch]==1.0.1",
    "huggingface_hub>=1.30",
    "safetensors>=0.8",
    "pandas>=3.0",
    "numpy>=2.5",
    "pyarrow>=25",
    "requests>=2.34",
    "lxml>=6.1",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "lightgbm>=4.7",
]

[tool.setuptools]
packages = ["infra", "tournament", "validation"]
